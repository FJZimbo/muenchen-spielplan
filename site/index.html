<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Münchner Spielplan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Layout: a poster-style programme. Month titles as heavy expanded type with a rule,
   each day a block with a big date column and event cards; filters stay pinned on top. */
:root {
  --paper: #ffffff;
  --ink: #121317;
  --muted: #5c5f68;
  --line: #e2e3e8;
  --soft: #f2f3f5;
  --gold: #f4c300;          /* Munich black & gold */
  --on-gold: #121317;
  --sold: #c8102e;
  --few: #a85400;
  --cancel: #6b6f78;
  --c-theatre: #c4122f;
  --c-opera: #8f5f00;
  --c-concert: #00766a;
  --c-cinema: #3b3fa6;
  --shadow: 0 1px 0 rgba(18, 19, 23, .04), 0 8px 24px -16px rgba(18, 19, 23, .25);

  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;

  --radius: 6px;
  --max: 1240px;
  --gutter: clamp(16px, 3vw, 32px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121317; --ink: #f1f1f3; --muted: #a2a5ae; --line: #2a2c33; --soft: #1c1e24;
    --gold: #f4c300; --on-gold: #121317; --sold: #ff6b7f; --few: #f0a24a; --cancel: #9a9ea8;
    --c-theatre: #ff5a6e; --c-opera: #e2b04a; --c-concert: #3cc4b1; --c-cinema: #8f93ff;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 24px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121317; --ink: #f1f1f3; --muted: #a2a5ae; --line: #2a2c33; --soft: #1c1e24;
  --gold: #f4c300; --on-gold: #121317; --sold: #ff6b7f; --few: #f0a24a; --cancel: #9a9ea8;
  --c-theatre: #ff5a6e; --c-opera: #e2b04a; --c-concert: #3cc4b1; --c-cinema: #8f93ff;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 24px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 15px/1.45 var(--body);
}
a { color: inherit; }
img { max-width: 100%; display: block; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: var(--max); margin: 0 auto; padding-inline: var(--gutter); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- masthead */
.masthead { border-bottom: 2px solid var(--ink); }
.masthead .wrap { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-block: 18px 14px; flex-wrap: wrap; }
.brand { text-decoration: none; display: grid; gap: 2px; }
.brand-name {
  font: 900 clamp(28px, 5vw, 46px)/.9 var(--display); font-stretch: 125%;
  letter-spacing: -.02em; text-transform: uppercase;
}
.brand-name span { background: var(--gold); color: var(--on-gold); padding: 0 .12em; }
.brand-sub { font-size: 13px; color: var(--muted); letter-spacing: .02em; }
.mast-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.updated { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.updated.stale { color: var(--few); }
.lang { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
.lang button { background: none; border: 0; padding: 4px 11px; font-weight: 700; font-size: 12.5px; letter-spacing: .06em; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tabs { border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; gap: 4px; }
.tabs a {
  padding: 10px 14px; text-decoration: none; color: var(--muted);
  font: 800 14px/1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .04em;
}
.tabs a:first-child { margin-left: -14px; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -3px var(--gold); }
.preview-note { background: var(--gold); color: var(--on-gold); font-size: 13px; }
.preview-note .wrap { padding-block: 8px; }

/* ---------- sticky filter bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--paper); border-bottom: 1px solid var(--line);
}
.bar .wrap { display: grid; gap: 10px; padding-block: 12px 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.search {
  flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 8px;
  border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; background: var(--paper);
}
.search:focus-within { border-color: var(--ink); }
.search input { border: 0; outline: 0; background: none; width: 100%; min-width: 0; padding: 2px 0; }
.search svg { flex: none; color: var(--muted); }
.toggle, .chip {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none;
  border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px;
  padding: 6px 13px; font-size: 13.5px; font-weight: 600; white-space: nowrap;
}
.toggle:hover, .chip:hover { border-color: var(--ink); }
.toggle[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .ico { width: 18px; height: 18px; }
/* venue logo bubbles: the venue's white/black cut-out logo on its brand colour */
.chip .bub, .vb, .bub.big {
  border-radius: 50%; display: inline-grid; place-items: center; flex: none; overflow: hidden;
  box-shadow: 0 0 0 1px var(--line);
  color: #fff; font: 800 8.5px/1 var(--display); font-stretch: 100%; letter-spacing: -.01em;
}
.chip .bub { width: 28px; height: 28px; margin: -3px 0 -3px -9px; }
.vb { width: 18px; height: 18px; }
.chip .bub img, .vb img, .bub.big img { width: 100%; height: 100%; }
.bub.big { width: 52px; height: 52px; font-size: 13px; }
.chip .n { font-weight: 500; opacity: .6; font-variant-numeric: tabular-nums; }
.date-jump { border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 10px; background: var(--paper); font-size: 13.5px; }
.time-from { cursor: pointer; font-weight: 600; }
.time-from.active { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; min-width: 0; }
.chips::-webkit-scrollbar { display: none; }
.more-filters { display: grid; gap: 8px; }
.filter-toggle { display: none; }
.clear { background: none; border: 0; text-decoration: underline; color: var(--muted); cursor: pointer; font-size: 13px; padding: 4px; }

/* day strip */
.strip { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; min-width: 0; scroll-behavior: smooth; }
.strip .m {
  flex: none; writing-mode: vertical-rl; transform: rotate(180deg); font: 800 10px/1 var(--display);
  font-stretch: 125%; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  padding: 4px 2px; border-right: 2px solid var(--ink); margin-left: 6px;
}
.strip a {
  flex: none; display: grid; justify-items: center; gap: 1px; text-decoration: none;
  min-width: 46px; padding: 5px 6px 4px; border-radius: var(--radius); border: 1.5px solid transparent;
}
.strip a:hover { border-color: var(--line); }
.strip .wd { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.strip .dn { font: 800 19px/1 var(--display); font-variant-numeric: tabular-nums; }
.strip .ct { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.strip a.today .dn { background: var(--gold); color: var(--on-gold); padding: 1px 4px; border-radius: 3px; }
.strip a.current { border-color: var(--ink); }

/* ---------- programme */
main { padding-block: 8px 48px; }
.status-msg { padding-block: 40px; color: var(--muted); font-size: 16px; max-width: 60ch; }
.month {
  margin: 44px 0 0; padding-bottom: 8px; border-bottom: 4px solid var(--ink);
  font: 900 clamp(34px, 6.5vw, 72px)/.92 var(--display); font-stretch: 125%;
  letter-spacing: -.03em; text-transform: uppercase; text-wrap: balance;
}
.month small { font: 500 .3em/1 var(--body); letter-spacing: .04em; color: var(--muted); margin-left: .4em; vertical-align: .9em; white-space: nowrap; }
.day { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 20px; padding-block: 22px; border-bottom: 1px solid var(--line); }
.day-head { position: sticky; top: var(--bar-h, 150px); align-self: start; display: grid; gap: 2px; }
.day-num { font: 900 56px/.85 var(--display); font-stretch: 112%; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.day-wd { font-weight: 700; font-size: 14px; }
.day-ct { font-size: 12.5px; color: var(--muted); }
.today-badge { justify-self: start; margin-top: 6px; background: var(--gold); color: var(--on-gold); font-weight: 700; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; }
.day-body { display: grid; gap: 18px; min-width: 0; }
.sub-h { margin: 4px 0 -6px; font: 800 12px/1 var(--display); font-stretch: 125%; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.sub-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
/* --vc / --vc-ink: venue colour and readable text on it, set per card */
.ev {
  display: flex; flex-direction: column; min-width: 0; background: var(--paper);
  border: 1px solid var(--line); border-top: 4px solid var(--vc, var(--line));
  border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
}
.media { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--soft); overflow: hidden; display: block; }
/* the cover sits above the venue placeholder, which only shows when there is no image or it fails to load */
.media > img, .poster > img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; }
.media > img { transition: transform .4s ease; }
.ev:hover .media > img { transform: scale(1.03); }
.ph {
  position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px;
  padding: 12px 14px; color: var(--vc-ink, #fff); overflow: hidden;
}
.ph.has-logo, .poster .ph.has-logo { align-items: center; justify-content: center; }
.ph .ph-logo { width: 34%; max-width: 110px; aspect-ratio: 1; }
.poster .ph .ph-logo { width: 70%; }
.ph .ph-short { font: 900 44px/.85 var(--display); font-stretch: 125%; text-transform: uppercase; opacity: .95; letter-spacing: -.02em; }
.ph .ph-ico { width: 28px; height: 28px; flex: none; opacity: .8; }
.ph::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 2px, transparent 2px 14px); pointer-events: none; }
.cat-badge {
  position: absolute; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 5px;
  background: var(--paper); color: var(--ink); border-radius: 999px; padding: 3px 9px 3px 6px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .03em;
}
.cat-badge .ico { width: 15px; height: 15px; }
.ev-body { display: grid; gap: 7px; padding: 12px 14px 14px; flex: 1; align-content: start; }
.ev-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.time { font: 800 22px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.venue {
  display: inline-flex; align-items: center; gap: 6px; min-width: 0;
  font-size: 12.5px; font-weight: 600; color: var(--muted);
}
.venue b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-title { margin: 0; font: 800 19px/1.15 var(--display); letter-spacing: -.01em; text-wrap: balance; overflow-wrap: anywhere; }
.ev-title a { text-decoration: none; }
.ev-title a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.ev-sub { margin: 0; font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { margin: 0; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.meta span:not(:last-child)::after { content: "·"; margin-left: 10px; opacity: .6; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; }
.state { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; border-radius: 3px; padding: 2px 7px; color: var(--paper); }
.state.sold_out { background: var(--sold); }
.state.few { background: var(--few); }
.state.cancelled { background: var(--cancel); }
.note { font-size: 11.5px; color: var(--muted); font-style: italic; }
.actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: 13px; font-weight: 700;
  border: 1.5px solid var(--ink); border-radius: 999px; padding: 5px 13px;
}
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--vc, var(--ink)); color: var(--vc-ink, var(--paper)); border-color: var(--vc, var(--ink)); }
.btn.primary:hover { opacity: .85; background: var(--vc, var(--ink)); }
.ev.is-sold_out .media img, .ev.is-cancelled .media img { filter: grayscale(.85); opacity: .7; }
.ev.is-cancelled .ev-title { text-decoration: line-through; text-decoration-thickness: 2px; }

/* cinema */
.films { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
.film {
  display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; min-width: 0;
  border: 1px solid var(--line); border-left: 4px solid var(--vc, var(--line));
  border-radius: var(--radius); padding: 10px; background: var(--paper);
}
.poster { position: relative; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 3px; overflow: hidden; background: var(--soft); }
.poster .ph { padding: 6px; flex-direction: column; align-items: flex-start; justify-content: flex-end; }
.poster .ph .ph-short { font-size: 15px; }
.poster .ph .ph-ico { width: 18px; height: 18px; }
.film-body { display: grid; gap: 6px; align-content: start; min-width: 0; }
.film .ev-title { font-size: 16px; }
.times { display: flex; flex-wrap: wrap; gap: 5px; }
.t {
  display: inline-flex; align-items: baseline; gap: 4px; text-decoration: none;
  border: 1.5px solid var(--ink); border-radius: 4px; padding: 3px 7px;
  font: 700 13.5px/1.1 var(--display); font-variant-numeric: tabular-nums;
}
.t small { font: 700 9.5px/1 var(--body); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
a.t:hover { background: var(--vc, var(--ink)); border-color: var(--vc, var(--ink)); color: var(--vc-ink, var(--paper)); }
a.t:hover small { color: inherit; }
.t.sold_out { border-color: var(--line); color: var(--muted); text-decoration: line-through; }
.t.past { opacity: .4; }

.more-sentinel { height: 1px; }
.empty { padding: 32px 0; color: var(--muted); }

/* ---------- today */
.today-chips { margin-top: 18px; }
.today-done { margin: 14px 0 0; color: var(--muted); font-size: 15px; }
.slideshow { position: relative; margin-top: 16px; }
.slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: var(--radius); background: #121317; }
.slides::-webkit-scrollbar { display: none; }
.slide {
  position: relative; flex: 0 0 100%; min-width: 0; scroll-snap-align: start; overflow: hidden;
  aspect-ratio: 16 / 9; min-height: 420px; max-height: min(68vh, 640px);
  border-top: 4px solid var(--vc); color: #fff;
}
/* many covers are small or portrait: show them whole over a blurred copy instead of cropping and enlarging */
.slide-bg { position: absolute; inset: -24px; width: calc(100% + 48px); max-width: none; height: calc(100% + 48px); object-fit: cover; filter: blur(20px) brightness(.55); }
.slide-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.slide::after { content: ""; position: absolute; inset: 35% 0 0; background: linear-gradient(transparent, rgba(0, 0, 0, .86)); pointer-events: none; }
.slide-link { position: absolute; inset: 0; z-index: 2; }
.slide-text { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; display: grid; gap: 6px; padding: 20px clamp(16px, 5vw, 72px); pointer-events: none; }
.slide-text a { pointer-events: auto; }
.slide-time { font: 800 22px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.slide-title { margin: 0; font: 900 clamp(26px, 4.4vw, 48px)/1.02 var(--display); letter-spacing: -.02em; text-wrap: balance; overflow-wrap: break-word; }
.slide-sub { margin: 0; font-size: 14px; opacity: .88; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.slide-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; font-weight: 600; }
.slide-foot .vb { width: 26px; height: 26px; }
.slide-foot .btn { margin-left: auto; border-color: var(--vc); background: var(--vc); color: var(--vc-ink); }
.slide-foot .btn:hover { background: var(--vc); opacity: .85; }
.slide-nav {
  position: absolute; z-index: 4; top: 50%; width: 44px; height: 44px; margin-top: -22px; border: 0; border-radius: 50%; cursor: pointer;
  background: rgba(18, 19, 23, .6); color: #fff; font-size: 20px; line-height: 1;
}
.slide-nav:hover { background: #121317; }
.slide-nav.prev { left: 12px; }
.slide-nav.next { right: 12px; }
.slide-count { margin: 8px 0 0; text-align: right; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- venues */
.vgroup { display: grid; gap: 18px; margin-top: 28px; }
.vcards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
/* tinted with the same venue colour as its filter chip */
.vcard {
  display: flex; flex-direction: column; min-width: 0; text-decoration: none; overflow: hidden;
  background: color-mix(in srgb, var(--vc) 7%, var(--paper));
  border: 1px solid color-mix(in srgb, var(--vc) 30%, var(--line)); border-top: 4px solid var(--vc);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.vcard:hover { border-color: var(--vc); }
.vcard:hover .media > img { transform: scale(1.03); }
.vcard .media, .vphoto .media { aspect-ratio: 3 / 2; }
.vcard .bub.big { position: absolute; z-index: 2; left: 10px; bottom: 10px; box-shadow: 0 0 0 2px var(--paper); }
.vcard-body { display: grid; gap: 4px; padding: 12px 14px 12px; flex: 1; align-content: start; }
.vcard-name { font: 800 20px/1.15 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.vcard-type, .vcard-addr { font-size: 13px; color: var(--muted); }
.vcard-n { margin-top: 4px; font-size: 13px; font-weight: 700; }
.vcard-credit, .vphoto figcaption { font-size: 11px; color: var(--muted); }
.back { display: inline-block; margin-top: 18px; font-size: 13.5px; font-weight: 600; text-decoration: none; }
.back:hover { text-decoration: underline; }
.vhead { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px 32px; margin-top: 14px; padding-top: 14px; border-top: 4px solid var(--vc); }
.vphoto { margin: 0; display: grid; gap: 6px; align-content: start; }
.vphoto .media { border-radius: var(--radius); }
.vphoto figcaption a:hover { color: var(--ink); }
.vinfo { display: grid; gap: 14px; align-content: start; min-width: 0; }
.vtitle { display: flex; align-items: center; gap: 12px; min-width: 0; }
.vtitle > div { min-width: 0; }
.vtitle h1 { margin: 0; font: 900 clamp(24px, 3.4vw, 38px)/1 var(--display); letter-spacing: -.02em; text-transform: uppercase; overflow-wrap: break-word; hyphens: auto; text-wrap: balance; }
.vtitle p { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
.vintro { margin: 0; font-size: 16px; line-height: 1.5; max-width: 62ch; }
.vaddr { display: grid; gap: 6px; }
.vaddr a { display: inline-flex; align-items: flex-start; gap: 6px; font-weight: 600; text-underline-offset: 3px; }
.vaddr .ico { flex: none; width: 18px; height: 18px; margin-top: 1px; }

/* ---------- footer / sources */
footer { border-top: 2px solid var(--ink); }
footer .wrap { padding-block: 24px 40px; display: grid; gap: 14px; }
.sources-h { font: 800 13px/1 var(--display); font-stretch: 125%; text-transform: uppercase; letter-spacing: .1em; margin: 0; }
.sources { display: grid; gap: 6px 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); font-size: 13px; }
.src { display: flex; align-items: center; gap: 8px; min-width: 0; }
.src a { text-decoration: none; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src a:hover { text-decoration: underline; }
.src .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.src .n.bad { color: var(--sold); font-weight: 700; }
.fine { font-size: 12.5px; color: var(--muted); max-width: 80ch; margin: 0; }

.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

@media (max-width: 760px) {
  .day { grid-template-columns: minmax(0, 1fr); gap: 12px; padding-block: 18px; }
  .vhead { grid-template-columns: minmax(0, 1fr); }
  .slide { aspect-ratio: 4 / 5; max-height: 72vh; }
  .slide-nav { top: 28%; width: 38px; height: 38px; }
  .slide-nav.prev { left: 8px; }
  .slide-nav.next { right: 8px; }
  .day-head { position: static; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .day-num { font-size: 40px; }
  .today-badge { margin-top: 0; }
  .filter-toggle { display: inline-flex; }
  .more-filters:not(.open) { display: none; }
  .strip a { min-width: 42px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <a class="brand" href="#">
      <span class="brand-name">München <span>Spielplan</span></span>
      <span class="brand-sub" id="brand-sub">Theater · Oper · Konzert · Kino in München</span>
    </a>
    <div class="mast-right">
      <span class="updated" id="updated"></span>
      <div class="lang" role="group" aria-label="Sprache / Language">
        <button type="button" data-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="Seiten / Pages">
  <div class="wrap">
    <a href="#" data-view="spielplan">Spielplan</a>
    <a href="#today" data-view="today">Heute</a>
    <a href="#venues" data-view="venues">Spielstätten</a>
  </div>
</nav>

<div class="bar">
  <div class="wrap">
    <div class="row">
      <label class="search" for="q">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off">
      </label>
      <button class="toggle" id="available" type="button" aria-pressed="false">Nur mit Karten</button>
      <input class="date-jump" id="date" type="date">
      <select class="date-jump time-from" id="from"></select>
      <button class="chip filter-toggle" id="filter-toggle" type="button" aria-expanded="false" aria-controls="more-filters">Filter</button>
    </div>
    <div class="more-filters" id="more-filters">
      <div class="row"><div class="chips" id="cats" aria-label="Kategorie"></div><button class="clear" id="clear" type="button">Zurücksetzen</button></div>
      <div class="chips" id="venues" aria-label="Häuser"></div>
    </div>
    <nav class="strip" id="strip" aria-label="Tage"></nav>
  </div>
</div>

<main class="wrap">
  <div id="page"></div>
  <p class="status-msg" id="status-msg" role="status"></p>
  <div id="programme"></div>
</main>

<footer>
  <div class="wrap">
    <h2 class="sources-h" id="sources-h">Quellen</h2>
    <div class="sources" id="sources"></div>
    <p class="fine" id="fine"></p>
  </div>
</footer>

<script>
(() => {
  "use strict";

  const TZ = "Europe/Berlin";
  const DAYS_PER_CHUNK = 7;
  const FROM_HOURS = [12, 14, 16, 17, 18, 19, 20, 21];

  // ------------------------------------------------------------------ text
  const T = {
    de: {
      locale: "de-DE",
      sub: "Theater · Oper · Konzert · Kino in München",
      tabs: { spielplan: "Spielplan", today: "Heute", venues: "Spielstätten" },
      todayDone: "Heute gibt es keine Termine mehr. Das läuft als Nächstes:",
      slideshow: "Termine als Diashow", prevSlide: "Vorheriger Termin", nextSlide: "Nächster Termin",
      allVenues: "Alle Spielstätten", address: "Adresse", website: "Website", photo: "Foto", openMaps: "In Google Maps öffnen",
      search: "Titel, Haus, Bühne suchen",
      today: "Heute", available: "Nur mit Karten", filters: "Filter", clear: "Zurücksetzen",
      jump: "Zu Datum springen",
      anyTime: "Jede Uhrzeit", fromTime: (h) => `ab ${h} Uhr`, timeLabel: "Beginn ab Uhrzeit",
      cat: { theatre: "Theater", opera: "Oper", concert: "Konzert", cinema: "Kino" },
      stageEvents: "Bühne & Konzert", films: "Kino",
      events: (n) => `${n} ${n === 1 ? "Termin" : "Termine"}`,
      soldOut: "Ausverkauft", few: "Wenige Karten", cancelled: "Entfällt",
      info: "Info", tickets: "Tickets", free: "Eintritt frei", min: "Min.",
      derived: "Termin laut Spielzeitangabe. Verfügbarkeit im Ticketshop prüfen.",
      updated: "Stand", stale: "Daten älter als 2 Tage",
      loading: "Spielplan wird geladen …",
      noData: "Noch keine Termine. Der Spielplan wird täglich automatisch eingelesen. Nach dem ersten Lauf erscheinen hier alle Termine.",
      noMatch: "Keine Termine für diese Auswahl.",
      sources: "Quellen", fine: "Alle Angaben werden automatisch von den Websites der Häuser übernommen und täglich aktualisiert. Ohne Gewähr. Bitte vor dem Besuch beim Haus prüfen. Titel stehen immer im Original.",
      ok: (n) => `${n} Termine`, none: "keine Daten", kept: (n) => `${n} (alter Stand)`,
      preview: "Vorschau mit Beispieldaten vom 13.10.2026. Die gehostete Seite zeigt den vollständigen, täglich aktualisierten Spielplan.",
      wd: ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"],
    },
    en: {
      locale: "en-GB",
      sub: "Theatre · Opera · Concerts · Cinema in Munich",
      tabs: { spielplan: "Programme", today: "Today", venues: "Venues" },
      todayDone: "Nothing more on today. Coming up next:",
      slideshow: "Events slideshow", prevSlide: "Previous event", nextSlide: "Next event",
      allVenues: "All venues", address: "Address", website: "Website", photo: "Photo", openMaps: "Open in Google Maps",
      search: "Search title, venue, stage",
      today: "Today", available: "Tickets available", filters: "Filters", clear: "Reset",
      jump: "Jump to date",
      anyTime: "Any time", fromTime: (h) => `from ${h > 12 ? `${h - 12} pm` : h === 12 ? "noon" : `${h} am`}`, timeLabel: "Starting from",
      cat: { theatre: "Theatre", opera: "Opera", concert: "Concert", cinema: "Cinema" },
      stageEvents: "Stage & concerts", films: "Cinema",
      events: (n) => `${n} ${n === 1 ? "event" : "events"}`,
      soldOut: "Sold out", few: "Few tickets", cancelled: "Cancelled",
      info: "Info", tickets: "Tickets", free: "Free admission", min: "min",
      derived: "Date from the venue's run schedule. Check availability in the ticket shop.",
      updated: "Updated", stale: "Data older than 2 days",
      loading: "Loading programme …",
      noData: "No events yet. The programme is read automatically every day; all events appear here after the first run.",
      noMatch: "No events for this selection.",
      sources: "Sources", fine: "All information is taken automatically from the venues' websites and refreshed daily. No guarantee; please check with the venue before you go. Titles are always shown in the original.",
      ok: (n) => `${n} events`, none: "no data", kept: (n) => `${n} (older data)`,
      preview: "Preview with sample data from 13 Oct 2026. The hosted site shows the full programme, refreshed daily.",
      wd: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
    },
  };
  // Labels that come from the venues' sites but are not titles
  const EN_WORDS = {
    "Oper": "Opera", "Ballett": "Ballet", "Konzert": "Concert", "Schauspiel": "Drama", "Lesung": "Reading",
    "Gespräch": "Talk", "Offene Probe": "Open rehearsal", "Liederabend": "Song recital", "Kind&Co": "Kids",
    "Klassik": "Classical", "Tanz": "Dance", "Tanztheater": "Dance theatre", "Buchpräsentation": "Book launch",
    "Kinder": "Children", "Familie": "Family", "Chor": "Choir", "Filmmusik": "Film music", "Weltmusik": "World music",
    "Kabarett": "Cabaret", "Festspiele": "Festival", "Premiere": "Premiere", "Uraufführung": "World premiere",
    "Wiederaufnahme": "Revival", "Zum letzten Mal": "Final performance", "Gastspiel": "Guest performance",
    "Publikumsgespräch": "Post-show talk", "Party": "Party",
    "Symphoniekonzerte": "Symphony concert", "Kammerkonzerte": "Chamber concert",
    "Musik": "Music", "Operette": "Operetta",
  };

  const ICONS = {
    theatre: '<path d="M5 4.5c4 1.6 10 1.6 14 0V11a7 7 0 0 1-14 0z"/><path d="M9 10h.01M15 10h.01"/><path d="M9.5 14.5c1.4 1 3.6 1 5 0"/>',
    opera: '<path d="M3 4h18M3 20h18"/><path d="M4 4v16M20 4v16"/><path d="M4 4c0 6 3 9 6.5 10M20 4c0 6-3 9-6.5 10"/>',
    concert: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
    cinema: '<rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    pin: '<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  };
  const icon = (k, cls = "ico") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k] || ""}</svg>`;

  // ------------------------------------------------------------------ state
  const store = {
    get(k, d) { try { const v = localStorage.getItem("msp:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("msp:" + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
  };
  const state = {
    lang: store.get("lang", (navigator.language || "de").toLowerCase().startsWith("de") ? "de" : "en"),
    q: "",
    venues: new Set(store.get("venues", [])),
    cats: new Set(store.get("cats", [])),
    route: { view: "spielplan" },   // spielplan | today | venues | venue (with id)
    todayCat: null,  // category picked on the Today page
    availableOnly: store.get("available", false),
    fromHour: store.get("from", null),   // only events starting at or after this hour
    data: null,
    status: null,
    days: [],        // [{key, items}]
    rendered: 0,
  };
  const t = () => T[state.lang];
  const word = (w) => (state.lang === "en" && EN_WORDS[w]) || w;

  const $ = (s, root = document) => root.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  // ------------------------------------------------------------------ dates (always Munich time)
  const fmt = (opts) => new Intl.DateTimeFormat(t().locale, { timeZone: TZ, ...opts });
  const dayKey = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
  const todayKey = () => dayKey(new Date());
  const keyToDate = (k) => new Date(`${k}T12:00:00Z`);
  const hhmm = (iso) => iso.slice(11, 16);

  // ------------------------------------------------------------------ data
  const venueMap = () => Object.fromEntries(state.data.venues.map((v) => [v.id, v]));
  function upcomingCounts() {
    const today = todayKey();
    const counts = {};
    for (const e of state.data.events) if (e.start.slice(0, 10) >= today) counts[e.venue_id] = (counts[e.venue_id] || 0) + 1;
    return counts;
  }

  function matches(e, V) {
    const v = V[e.venue_id];
    if (!v) return false;
    if (state.venues.size && !state.venues.has(e.venue_id)) return false;
    if (state.cats.size && !state.cats.has(v.category)) return false;
    if (state.availableOnly && (e.status === "sold_out" || e.status === "cancelled")) return false;
    if (state.fromHour !== null && (e.time_tbd || hhmm(e.start) < `${String(state.fromHour).padStart(2, "0")}:00`)) return false;
    if (state.q) {
      const hay = `${e.title} ${e.subtitle || ""} ${v.name} ${e.stage || ""} ${e.genre || ""} ${(e.tags || []).join(" ")}`.toLowerCase();
      if (!state.q.split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    return true;
  }

  // today, or the next day with something on once today's last show has started
  function showcaseDay() {
    const now = new Date(), today = todayKey();
    const next = state.data.events.find((e) => e.start.slice(0, 10) >= today && e.status !== "cancelled" && (e.time_tbd || new Date(e.start) >= now));
    return next ? next.start.slice(0, 10) : today;
  }

  function buildDays() {
    const V = venueMap();
    const today = todayKey();
    const { view, id } = state.route;
    const showcase = view === "today" ? showcaseDay() : null;
    const byDay = new Map();
    for (const e of view === "venues" ? [] : state.data.events) {
      const k = e.start.slice(0, 10);
      if (k < today || !V[e.venue_id]) continue;
      if (view === "today" && (k !== showcase || (state.todayCat && V[e.venue_id].category !== state.todayCat))) continue;
      if (view === "venue" ? e.venue_id !== id : view === "spielplan" && !matches(e, V)) continue;
      if (!byDay.has(k)) byDay.set(k, []);
      byDay.get(k).push(e);
    }
    state.days = [...byDay.keys()].sort().map((key) => ({ key, items: byDay.get(key).sort((a, b) => a.start.localeCompare(b.start)) }));
  }

  // ------------------------------------------------------------------ rendering pieces
  // ------------------------------------------------------------------ venue branding
  const luminance = (hex) => {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };
  const darkMode = () => document.documentElement.dataset.theme === "dark" ||
    (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  // CSS vars for a card: the venue colour (lifted to light grey when a black brand would vanish on a dark page)
  // and the text colour that reads on it
  function venueVars(v) {
    const c = /^#[0-9a-f]{6}$/i.test(v.color || "") ? v.color : "#5c5f68";
    const accent = darkMode() && luminance(c) < 0.12 ? "#e8e9ed" : c;
    return `--vc:${accent};--vc-ink:${luminance(accent) > 0.5 ? "#121317" : "#ffffff"}`;
  }
  function venueBubble(v, cls = "vb") {
    const inner = v.logo ? `<img src="${esc(v.logo)}" alt="">` : cls.startsWith("bub") ? esc((v.short || "").slice(0, 4)) : "";
    return `<span class="${cls}" style="background:${esc(v.color)}" aria-hidden="true">${inner}</span>`;
  }

  function placeholder(v, cls = "") {
    if (v.logo) {
      return `<div class="ph has-logo ${cls}" style="background:${esc(v.color)}"><img class="ph-logo" src="${esc(v.logo)}" alt=""></div>`;
    }
    const short = v.short || v.name.slice(0, 3);
    return `<div class="ph ${cls}" style="background:${esc(v.color)}"><span class="ph-short">${esc(short)}</span>${icon(v.category, "ico ph-ico")}</div>`;
  }
  function imageOr(e, v) {
    const ph = placeholder(v);
    if (!e.image) return ph;
    return `${ph}<img src="${esc(e.image)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`;
  }
  function stateBadge(s) {
    if (s === "sold_out") return `<span class="state sold_out">${t().soldOut}</span>`;
    if (s === "few") return `<span class="state few">${t().few}</span>`;
    if (s === "cancelled") return `<span class="state cancelled">${t().cancelled}</span>`;
    return "";
  }
  function durationText(min) {
    if (!min) return "";
    const h = Math.floor(min / 60), m = min % 60;
    return state.lang === "de" ? (h ? `${h} Std.${m ? ` ${m} Min.` : ""}` : `${m} Min.`) : (h ? `${h} h${m ? ` ${m} min` : ""}` : `${m} min`);
  }

  function eventCard(e, v) {
    const meta = [e.stage, word(e.genre), durationText(e.duration_min), e.price === "free" ? t().free : e.price]
      .filter(Boolean).map((x) => `<span>${esc(x)}</span>`).join("");
    const tags = (e.tags || []).map((x) => `<span class="tag">${esc(word(x))}</span>`).join("") + stateBadge(e.status);
    const info = e.url ? `<a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">${t().info}</a>` : "";
    const tix = e.ticket_url && e.status !== "cancelled" && e.status !== "sold_out"
      ? `<a class="btn primary" href="${esc(e.ticket_url)}" target="_blank" rel="noopener">${t().tickets} →</a>` : "";
    return `<article class="ev is-${esc(e.status)}" style="${venueVars(v)}">
      <a class="media" href="${esc(e.url || v.home)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">
        ${imageOr(e, v)}<span class="cat-badge">${icon(v.category)}${esc(t().cat[v.category])}</span></a>
      <div class="ev-body">
        <div class="ev-top"><span class="time">${e.time_tbd ? "–" : hhmm(e.start)}</span>
          <span class="venue">${venueBubble(v)}<b>${esc(v.name)}</b></span></div>
        <h3 class="ev-title"><a href="${esc(e.url || v.home)}" target="_blank" rel="noopener">${esc(e.title)}</a></h3>
        ${e.subtitle ? `<p class="ev-sub">${esc(e.subtitle)}</p>` : e.description ? `<p class="ev-sub">${esc(e.description)}</p>` : ""}
        ${meta ? `<p class="meta">${meta}</p>` : ""}
        ${tags ? `<div class="tags">${tags}</div>` : ""}
        ${e.note === "derived" ? `<span class="note">${t().derived}</span>` : ""}
        ${info || tix ? `<div class="actions">${info}${tix}</div>` : ""}
      </div></article>`;
  }

  // "Garching · Hörsaal MW1801" -> city in bold; a stage that only repeats the venue name is left out
  function filmMeta(stage, dur, v) {
    const parts = [];
    if (stage && !v.name.includes(stage)) {
      const [place, ...room] = stage.split(" · ");
      parts.push(room.length ? `<b>${esc(place)}</b> · ${esc(room.join(" · "))}` : esc(stage));
    }
    if (dur) parts.push(esc(durationText(dur)));
    return parts.length ? `<p class="meta">${parts.map((p) => `<span>${p}</span>`).join("")}</p>` : "";
  }

  function filmCard(group, v) {
    const first = group[0];
    const now = new Date();
    const times = group.map((e) => {
      const ver = (e.tags || [])[0];
      const past = new Date(e.start) < now;
      const cls = `t ${e.status === "sold_out" ? "sold_out" : ""} ${past ? "past" : ""}`;
      const inner = `${hhmm(e.start)}${ver ? `<small>${esc(ver)}</small>` : ""}`;
      const href = e.ticket_url || e.url;
      const label = e.status === "sold_out" ? ` title="${t().soldOut}"` : "";
      return href && e.status !== "sold_out" && !past
        ? `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener">${inner}</a>`
        : `<span class="${cls}"${label}>${inner}</span>`;
    }).join("");
    const img = group.find((e) => e.image)?.image;
    const dur = group.find((e) => e.duration_min)?.duration_min;
    return `<article class="film" style="${venueVars(v)}">
      <a class="poster" href="${esc(first.url || v.home)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">
        ${placeholder(v)}${img ? `<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}</a>
      <div class="film-body">
        <span class="venue">${venueBubble(v)}<b>${esc(v.name)}</b></span>
        <h3 class="ev-title"><a href="${esc(first.url || v.home)}" target="_blank" rel="noopener">${esc(first.title)}</a></h3>
        ${filmMeta(first.stage, dur, v)}
        <div class="times">${times}</div>
      </div></article>`;
  }

  function dayHTML(day, V) {
    const d = keyToDate(day.key);
    const stage = [], films = new Map();
    for (const e of day.items) {
      const v = V[e.venue_id];
      if (v.category === "cinema") {
        const k = `${e.venue_id}|${e.title.toLowerCase()}`;
        if (!films.has(k)) films.set(k, []);
        films.get(k).push(e);
      } else stage.push(e);
    }
    const isToday = day.key === todayKey();
    const wd = fmt({ weekday: "long" }).format(d);
    let body = "";
    if (stage.length) {
      body += films.size ? `<h4 class="sub-h">${t().stageEvents}</h4>` : "";
      body += `<div class="cards">${stage.map((e) => eventCard(e, V[e.venue_id])).join("")}</div>`;
    }
    if (films.size) {
      body += `<h4 class="sub-h">${t().films}</h4>`;
      body += `<div class="films">${[...films.values()].map((g) => filmCard(g, V[g[0].venue_id])).join("")}</div>`;
    }
    return `<section class="day" id="day-${day.key}" data-key="${day.key}">
      <header class="day-head"><span class="day-num">${fmt({ day: "numeric" }).format(d)}</span>
        <span class="day-wd">${esc(wd)}</span><span class="day-ct">${t().events(day.items.length)}</span>
        ${isToday ? `<span class="today-badge">${t().today}</span>` : ""}</header>
      <div class="day-body">${body}</div></section>`;
  }

  function monthHTML(key) {
    const d = keyToDate(key);
    const month = fmt({ month: "long" }).format(d);
    return `<h2 class="month" id="month-${key.slice(0, 7)}">${esc(month)}<small>${key.slice(0, 4)}</small></h2>`;
  }

  // ------------------------------------------------------------------ programme (rendered in chunks)
  let observer;
  function renderProgramme() {
    const box = $("#programme");
    const msg = $("#status-msg");
    state.rendered = 0;
    box.innerHTML = "";
    if (state.route.view === "venues") { msg.hidden = true; return; }
    if (!state.data.events.length) { msg.textContent = t().noData; msg.hidden = false; return; }
    if (!state.days.length) { msg.textContent = t().noMatch; msg.hidden = false; return; }
    msg.hidden = true;
    renderMore(DAYS_PER_CHUNK);
  }

  function renderMore(n) {
    const box = $("#programme");
    const V = venueMap();
    const end = Math.min(state.days.length, state.rendered + n);
    let html = "";
    for (let i = state.rendered; i < end; i++) {
      const key = state.days[i].key;
      const prev = i > 0 ? state.days[i - 1].key : null;
      if (!prev || prev.slice(0, 7) !== key.slice(0, 7)) html += monthHTML(key);
      html += dayHTML(state.days[i], V);
    }
    $(".more-sentinel", box)?.remove();
    box.insertAdjacentHTML("beforeend", html + (end < state.days.length ? '<div class="more-sentinel"></div>' : ""));
    state.rendered = end;
    const s = $(".more-sentinel", box);
    if (s) {
      observer?.disconnect();
      observer = new IntersectionObserver((ents) => { if (ents.some((x) => x.isIntersecting)) renderMore(DAYS_PER_CHUNK); }, { rootMargin: "1200px" });
      observer.observe(s);
    }
  }

  function jumpTo(key) {
    const idx = state.days.findIndex((d) => d.key >= key);
    if (idx < 0) return;
    if (idx >= state.rendered) renderMore(idx - state.rendered + 3);
    const el = document.getElementById(`day-${state.days[idx].key}`);
    if (!el) return;
    const barH = $(".bar").getBoundingClientRect().height;
    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - barH - 6, behavior: "smooth" });
  }

  // ------------------------------------------------------------------ today
  let slideTimer;
  // one slide per stage event, then one per film with all its remaining screenings
  function todaySlides() {
    const V = venueMap(), now = new Date();
    const stage = [], films = new Map();
    for (const e of state.days[0]?.items || []) {
      if (e.status === "cancelled" || (!e.time_tbd && new Date(e.start) < now)) continue;
      const v = V[e.venue_id];
      if (v.category !== "cinema") { stage.push({ v, items: [e] }); continue; }
      const k = `${e.venue_id}|${e.title.toLowerCase()}`;
      if (!films.has(k)) films.set(k, { v, items: [] });
      films.get(k).items.push(e);
    }
    return [...stage, ...films.values()];
  }

  function slideHTML({ v, items }) {
    const e = items[0];
    const img = items.find((x) => x.image)?.image;
    const pic = img ? `<img class="slide-bg" src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">
      <img class="slide-img" src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
    const time = e.time_tbd ? "–" : items.map((x) => hhmm(x.start)).join(" · ");
    const sub = e.subtitle || e.description;
    const place = [v.name, v.category === "cinema" ? "" : e.stage].filter(Boolean).join(" · ");
    const href = items.find((x) => x.ticket_url && x.status !== "sold_out")?.ticket_url;
    return `<article class="slide" style="${venueVars(v)}">
      ${placeholder(v)}${pic}
      <a class="slide-link" href="${esc(e.url || v.home)}" target="_blank" rel="noopener" aria-label="${esc(e.title)}"></a>
      <div class="slide-text">
        <span class="slide-time">${esc(time)}</span>
        <h3 class="slide-title">${esc(e.title)}</h3>
        ${sub ? `<p class="slide-sub">${esc(sub)}</p>` : ""}
        <div class="slide-foot">${venueBubble(v)}<span>${esc(place)}</span>${stateBadge(e.status)}
          ${href ? `<a class="btn" href="${esc(href)}" target="_blank" rel="noopener">${t().tickets} →</a>` : ""}</div>
      </div></article>`;
  }

  function todayHTML() {
    const V = venueMap();
    const key = showcaseDay();
    const d = keyToDate(key);
    const cats = CATS.filter((c) => state.data.events.some((e) => e.start.slice(0, 10) === key && V[e.venue_id]?.category === c));
    const chips = cats.map((c) => `<button class="chip" type="button" data-today-cat="${c}" aria-pressed="${state.todayCat === c}">${icon(c)}${esc(t().cat[c])}</button>`).join("");
    const slides = todaySlides();
    const show = slides.length ? `<section class="slideshow" aria-roledescription="carousel" aria-label="${esc(t().slideshow)}">
        <div class="slides" id="slides">${slides.map(slideHTML).join("")}</div>
        ${slides.length > 1 ? `<button class="slide-nav prev" type="button" data-step="-1" aria-label="${esc(t().prevSlide)}">←</button>
        <button class="slide-nav next" type="button" data-step="1" aria-label="${esc(t().nextSlide)}">→</button>` : ""}
        <p class="slide-count" id="slide-count"></p></section>` : "";
    return `<h2 class="month">${esc(key === todayKey() ? t().today : fmt({ weekday: "long" }).format(d))}<small>${esc(fmt({ day: "numeric", month: "long" }).format(d))}</small></h2>
      ${key === todayKey() ? "" : `<p class="today-done">${esc(t().todayDone)}</p>`}
      <div class="chips today-chips">${chips}</div>${show}`;
  }

  function startSlideshow() {
    const track = $("#slides");
    if (!track) return;
    const box = track.parentElement, count = $("#slide-count"), total = track.children.length;
    const current = () => Math.round(track.scrollLeft / track.clientWidth);
    const show = () => { count.textContent = `${current() + 1} / ${total}`; };
    const go = (i) => track.scrollTo({ left: ((i + total) % total) * track.clientWidth, behavior: "smooth" });
    let paused = false;
    box.addEventListener("pointerenter", () => { paused = true; });
    box.addEventListener("pointerleave", () => { paused = false; });
    box.addEventListener("focusin", () => { paused = true; });
    box.addEventListener("focusout", () => { paused = false; });
    box.addEventListener("click", (ev) => { const b = ev.target.closest("[data-step]"); if (b) go(current() + Number(b.dataset.step)); });
    track.addEventListener("scroll", show, { passive: true });
    show();
    if (total > 1 && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      slideTimer = setInterval(() => { if (!paused && !document.hidden) go(current() + 1); }, 6000);
    }
  }

  // ------------------------------------------------------------------ venues
  const CATS = ["theatre", "opera", "concert", "cinema"];
  const localized = (o) => o?.[state.lang] || o?.de || "";
  const mapsUrl = (address) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
  function venuePhoto(v) {
    const ph = placeholder(v);
    if (!v.photo) return ph;
    return `${ph}<img src="${esc(v.photo.file)}" alt="${esc(v.name)}" loading="lazy" decoding="async" onerror="this.remove()">`;
  }

  function venueCard(v, n) {
    const credit = v.photo ? `<span class="vcard-credit">${t().photo}: ${esc(v.photo.credit)}, ${esc(v.photo.license)}</span>` : "";
    return `<a class="vcard" href="#venues/${esc(v.id)}" style="${venueVars(v)}">
      <span class="media">${venuePhoto(v)}${v.photo ? venueBubble(v, "bub big") : ""}</span>
      <span class="vcard-body"><span class="vcard-name">${esc(v.name)}</span>
        <span class="vcard-type">${esc(localized(v.type))}</span>
        <span class="vcard-addr">${esc(v.address?.[0] || "")}</span>
        <span class="vcard-n">${t().events(n)}</span>${credit}</span></a>`;
  }

  function venuesHTML() {
    const counts = upcomingCounts();
    const groups = CATS.map((c) => {
      const list = state.data.venues.filter((v) => v.category === c);
      return list.length ? `<section class="vgroup"><h3 class="sub-h">${esc(t().cat[c])}</h3>
        <div class="vcards">${list.map((v) => venueCard(v, counts[v.id] || 0)).join("")}</div></section>` : "";
    }).join("");
    return `<h2 class="month">${esc(t().tabs.venues)}</h2>${groups}`;
  }

  function venueHTML(v) {
    const addresses = (v.address || []).map((a) => `<a href="${esc(mapsUrl(a))}" target="_blank" rel="noopener" title="${esc(t().openMaps)}">${icon("pin")}<span>${esc(a)}</span></a>`).join("");
    const caption = v.photo ? `<figcaption>${t().photo}: <a href="${esc(v.photo.source)}" target="_blank" rel="noopener">${esc(v.photo.credit)}</a>, ${esc(v.photo.license)}</figcaption>` : "";
    return `<a class="back" href="#venues">← ${esc(t().allVenues)}</a>
      <section class="vhead" style="${venueVars(v)}">
        <figure class="vphoto"><div class="media">${venuePhoto(v)}</div>${caption}</figure>
        <div class="vinfo">
          <div class="vtitle">${venueBubble(v, "bub big")}<div><h1>${esc(v.name)}</h1><p>${esc(localized(v.type))}</p></div></div>
          <p class="vintro">${esc(localized(v.intro))}</p>
          ${addresses ? `<div class="vaddr"><h2 class="sources-h">${esc(t().address)}</h2>${addresses}</div>` : ""}
          <div class="actions"><a class="btn primary" href="${esc(v.home)}" target="_blank" rel="noopener">${esc(t().website)} →</a></div>
        </div>
      </section>
      <h2 class="month">${esc(t().tabs.spielplan)}</h2>`;
  }

  function renderPage() {
    const { view, id } = state.route;
    $(".bar").hidden = view !== "spielplan";
    const venue = view === "venue" ? venueMap()[id] : null;
    clearInterval(slideTimer);
    $("#page").innerHTML = view === "today" ? todayHTML() : view === "venues" ? venuesHTML() : venue ? venueHTML(venue) : "";
    if (view === "today") startSlideshow();
    const tab = view === "venue" ? "venues" : view;
    document.querySelectorAll(".tabs a").forEach((a) => {
      a.textContent = t().tabs[a.dataset.view];
      if (a.dataset.view === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
  }

  // ------------------------------------------------------------------ chrome (filters, strip, footer)
  function renderStrip() {
    const strip = $("#strip");
    const today = todayKey();
    let html = "", lastMonth = "";
    for (const day of state.days.slice(0, 120)) {
      const d = keyToDate(day.key);
      const m = day.key.slice(0, 7);
      if (m !== lastMonth) { html += `<span class="m">${esc(fmt({ month: "short" }).format(d))}</span>`; lastMonth = m; }
      html += `<a href="#day-${day.key}" data-key="${day.key}" class="${day.key === today ? "today" : ""}">
        <span class="wd">${t().wd[d.getUTCDay()]}</span><span class="dn">${d.getUTCDate()}</span><span class="ct">${day.items.length}</span></a>`;
    }
    strip.innerHTML = html;
  }

  function renderChips() {
    const V = state.data.venues;
    const counts = upcomingCounts();
    const cats = CATS.filter((c) => V.some((v) => v.category === c));
    $("#cats").innerHTML = cats.map((c) => `<button class="chip" type="button" data-cat="${c}" aria-pressed="${state.cats.has(c)}">
      ${icon(c)}${esc(t().cat[c])}</button>`).join("");
    $("#venues").innerHTML = V.map((v) => `<button class="chip" type="button" data-venue="${esc(v.id)}" aria-pressed="${state.venues.has(v.id)}">
      ${venueBubble(v, "bub")}${esc(v.name)}
      <span class="n">${counts[v.id] || 0}</span></button>`).join("");
  }

  function renderChrome() {
    document.documentElement.lang = state.lang;
    $("#brand-sub").textContent = t().sub;
    $("#q").placeholder = t().search;
    $("#q").setAttribute("aria-label", t().search);
    $("#available").textContent = t().available;
    $("#available").setAttribute("aria-pressed", state.availableOnly);
    const from = $("#from");
    from.innerHTML = `<option value="">${esc(t().anyTime)}</option>` +
      FROM_HOURS.map((h) => `<option value="${h}">${esc(t().fromTime(h))}</option>`).join("");
    from.value = state.fromHour ?? "";
    from.classList.toggle("active", state.fromHour !== null);
    from.setAttribute("aria-label", t().timeLabel);
    from.title = t().timeLabel;
    $("#filter-toggle").textContent = t().filters;
    $("#clear").textContent = t().clear;
    $("#date").setAttribute("aria-label", t().jump);
    $("#date").title = t().jump;
    $("#sources-h").textContent = t().sources;
    $("#fine").textContent = t().fine;
    document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === state.lang));
    const pv = $("#preview-note");
    if (pv) pv.querySelector(".wrap").textContent = t().preview;

    const gen = state.data.generated_at ? new Date(state.data.generated_at) : null;
    const up = $("#updated");
    if (gen) {
      const stale = Date.now() - gen.getTime() > 48 * 3600e3;
      up.textContent = `${t().updated}: ${fmt({ day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(gen)}${stale ? ` · ${t().stale}` : ""}`;
      up.classList.toggle("stale", stale);
    } else up.textContent = "";

    // sources
    const today = todayKey();
    const counts = upcomingCounts();
    const st = state.status?.venues || {};
    $("#sources").innerHTML = state.data.venues.map((v) => {
      const s = st[v.id];
      const n = counts[v.id] || 0;
      let label = n ? t().ok(n) : t().none;
      if (s && s.ok === false && s.kept_previous) label = t().kept(n);
      const bad = !n || (s && s.ok === false);
      return `<div class="src">${venueBubble(v)}<a href="${esc(v.home)}" target="_blank" rel="noopener">${esc(v.name)}</a>
        <span class="n ${bad ? "bad" : ""}">${esc(label)}</span></div>`;
    }).join("");
    const dates = state.data.events.map((e) => e.start.slice(0, 10)).filter((k) => k >= today).sort();
    const dateEl = $("#date");
    if (dates.length) { dateEl.min = dates[0]; dateEl.max = dates[dates.length - 1]; }
  }

  function refresh({ keepScroll = false } = {}) {
    buildDays();
    renderChips();
    renderChrome();
    renderStrip();
    renderPage();
    renderProgramme();
    if (!keepScroll) window.scrollTo({ top: 0 });
    setBarHeight();
  }

  function setBarHeight() {
    const h = $(".bar").getBoundingClientRect().height;
    document.documentElement.style.setProperty("--bar-h", `${Math.round(h) + 12}px`);
  }

  function syncStripToScroll() {
    const barH = $(".bar").getBoundingClientRect().height;
    let current = null;
    for (const sec of document.querySelectorAll(".day")) {
      if (sec.getBoundingClientRect().top - barH - 20 <= 0) current = sec.dataset.key; else break;
    }
    document.querySelectorAll("#strip a").forEach((a) => a.classList.toggle("current", a.dataset.key === current));
    const active = $(`#strip a[data-key="${current}"]`);
    if (active) {
      const strip = $("#strip");
      const r = active.getBoundingClientRect(), s = strip.getBoundingClientRect();
      if (r.left < s.left || r.right > s.right) strip.scrollLeft += r.left - s.left - s.width / 3;
    }
  }

  // ------------------------------------------------------------------ events
  function bind() {
    document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
      state.lang = b.dataset.lang; store.set("lang", state.lang); refresh({ keepScroll: true });
    }));
    let qTimer;
    $("#q").addEventListener("input", (ev) => {
      clearTimeout(qTimer);
      qTimer = setTimeout(() => { state.q = ev.target.value.trim().toLowerCase(); refresh({ keepScroll: true }); }, 180);
    });
    $("#available").addEventListener("click", () => { state.availableOnly = !state.availableOnly; store.set("available", state.availableOnly); refresh({ keepScroll: true }); });
    $("#from").addEventListener("change", (ev) => {
      state.fromHour = ev.target.value === "" ? null : Number(ev.target.value);
      store.set("from", state.fromHour); refresh({ keepScroll: true });
    });
    $("#cats").addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-cat]"); if (!b) return;
      const c = b.dataset.cat; state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c);
      store.set("cats", [...state.cats]); refresh();
    });
    $("#venues").addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-venue]"); if (!b) return;
      const v = b.dataset.venue; state.venues.has(v) ? state.venues.delete(v) : state.venues.add(v);
      store.set("venues", [...state.venues]); refresh();
    });
    $("#clear").addEventListener("click", () => {
      state.venues.clear(); state.cats.clear(); state.q = ""; state.availableOnly = false; state.fromHour = null;
      $("#q").value = ""; store.set("venues", []); store.set("cats", []); store.set("available", false); store.set("from", null); refresh();
    });
    $("#filter-toggle").addEventListener("click", (ev) => {
      const open = $("#more-filters").classList.toggle("open");
      ev.currentTarget.setAttribute("aria-expanded", open); setBarHeight();
    });
    $("#date").addEventListener("change", (ev) => { if (ev.target.value) jumpTo(ev.target.value); });
    $("#strip").addEventListener("click", (ev) => {
      const a = ev.target.closest("a[data-key]"); if (!a) return;
      ev.preventDefault(); jumpTo(a.dataset.key);
    });
    let ticking = false;
    window.addEventListener("scroll", () => {
      if (ticking) return; ticking = true;
      requestAnimationFrame(() => { syncStripToScroll(); ticking = false; });
    }, { passive: true });
    window.addEventListener("resize", setBarHeight);
    window.addEventListener("hashchange", navigate);
    $("#page").addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-today-cat]"); if (!b) return;
      state.todayCat = state.todayCat === b.dataset.todayCat ? null : b.dataset.todayCat;
      refresh({ keepScroll: true });
    });
  }

  // ------------------------------------------------------------------ routing
  function parseRoute() {
    const h = location.hash.slice(1);
    if (h === "today" || h === "heute") return { view: "today" };
    if (h === "venues") return { view: "venues" };
    const m = h.match(/^venues\/(.+)$/);
    if (m && state.data.venues.some((v) => v.id === m[1])) return { view: "venue", id: m[1] };
    return { view: "spielplan" };
  }

  function navigate() {
    state.route = parseRoute();
    refresh();
    const m = location.hash.match(/^#day-(\d{4}-\d{2}-\d{2})$/);
    if (m) setTimeout(() => jumpTo(m[1]), 50);
  }

  // ------------------------------------------------------------------ boot
  async function load() {
    const embedded = document.getElementById("embedded-data");
    if (embedded && embedded.textContent.trim()) {
      const all = JSON.parse(embedded.textContent);
      return { data: all.events ? all : all.data, status: all.status || null };
    }
    const res = await fetch("data/events.json", { cache: "no-cache" });
    if (!res.ok) throw new Error(`events.json: HTTP ${res.status}`);
    const data = await res.json();
    let status = null;
    try { const r = await fetch("data/status.json", { cache: "no-cache" }); if (r.ok) status = await r.json(); } catch { /* optional */ }
    return { data, status };
  }

  async function init() {
    $("#status-msg").textContent = T[state.lang].loading;
    try {
      const { data, status } = await load();
      state.data = data; state.status = status;
    } catch (err) {
      console.error(err);
      state.data = { generated_at: null, venues: [], events: [] };
    }
    if (!state.data.venues?.length) state.data.venues = [];
    // forget saved filters for venues that no longer exist
    const ids = new Set(state.data.venues.map((v) => v.id));
    state.venues = new Set([...state.venues].filter((v) => ids.has(v)));
    bind();
    navigate();
  }

  init();
})();

</script>
</body>
</html>
